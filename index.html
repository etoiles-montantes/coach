<style>

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--navy);color:var(--white);font-family:Mulish,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}

.auto .box{visibility:hidden}
</style>
