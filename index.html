<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tableau tactique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500;700&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --color-navy:#113B54;--color-chartreuse:#DBE64C;--color-white:#FFFFFF;
  --color-periwinkle:#BBD1FF;--color-water-green:#E2F4DF;--color-pine:#024442;--color-black:#000;
  --bg:var(--color-white);--text:var(--color-black);
  --bar:var(--color-navy);--bar-text:var(--color-white);
  --soft:var(--color-water-green);--tool-text:var(--color-navy);
  --active-bg:var(--color-navy);--active-text:var(--color-white);
  --btn-bg:var(--color-white);--btn-text:var(--color-navy);--btn-border:var(--color-periwinkle);
  --card-bg:var(--color-periwinkle);--card-text:var(--color-black);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:var(--color-navy);--text:var(--color-white);
    --bar:var(--color-pine);--soft:var(--color-pine);--tool-text:var(--color-white);
    --active-bg:var(--color-chartreuse);--active-text:var(--color-black);
    --btn-bg:var(--color-navy);--btn-text:var(--color-white);
  }
}
:root[data-theme="dark"]{
  --bg:var(--color-navy);--text:var(--color-white);
  --bar:var(--color-pine);--soft:var(--color-pine);--tool-text:var(--color-white);
  --active-bg:var(--color-chartreuse);--active-text:var(--color-black);
  --btn-bg:var(--color-navy);--btn-text:var(--color-white);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Mulish,system-ui,sans-serif}
.app{height:100%}
.view{display:none;height:100%;flex-direction:column}
.view.active{display:flex}
.home-body{flex:1;overflow-y:auto;padding:20px 16px;width:100%;max-width:820px;margin:0 auto}
.home-body h2{font-family:"Funnel Display","Avenir Next",ui-sans-serif,sans-serif;font-weight:500;font-size:1.1rem;margin:0 0 14px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{width:100%;text-align:left;border:0;border-radius:16px;padding:16px;background:var(--card-bg);color:var(--card-text);display:flex;flex-direction:column;gap:6px;min-height:100px}
.card .name{font-family:"Funnel Display","Avenir Next",ui-sans-serif,sans-serif;font-weight:700;font-size:1.15rem;overflow-wrap:anywhere}
.card .meta{font-size:.85rem}
.empty{text-align:center;padding:40px 10px}
.name-input{font-family:"Funnel Display","Avenir Next",ui-sans-serif,sans-serif;font-weight:700;font-size:1.15rem;background:transparent;color:var(--bar-text);border:0;border-bottom:2px solid var(--color-periwinkle);padding:4px 2px;min-width:0;flex:1 1 160px;max-width:380px;margin-right:auto}
.name-input:focus{outline:none;border-bottom-color:var(--color-chartreuse)}
#board h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hbtn.primary{background:var(--color-chartreuse);border-color:var(--color-chartreuse);color:var(--color-black)}
#board[data-mode="view"] .edit-only,#board[data-mode="edit"] .view-only{display:none}
#board[data-mode="view"] main{grid-template-columns:1fr;grid-template-rows:1fr}
header{background:var(--bar);color:var(--bar-text);display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
h1{font-family:"Funnel Display","Avenir Next",Futura,ui-sans-serif,sans-serif;font-weight:700;font-size:1.3rem;margin:0 auto 0 0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--color-chartreuse);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.seg{display:flex;border:1px solid var(--color-periwinkle);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--bar-text);padding:7px 12px;font-weight:600;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--color-chartreuse);color:var(--color-black)}
.hbtn{border:1px solid var(--color-periwinkle);background:transparent;color:var(--bar-text);border-radius:999px;padding:7px 12px;font-weight:600;font-size:.85rem}
main{flex:1;min-height:0;display:grid;grid-template-columns:auto 1fr}
.tools{display:flex;flex-direction:column;gap:2px;padding:10px 8px;background:var(--soft);overflow-y:auto}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;width:68px;padding:7px 0;border:0;border-radius:12px;background:transparent;color:var(--tool-text);font-weight:600;font-size:.72rem}
.tool svg{width:24px;height:24px}
.tool[aria-pressed="true"]{background:var(--active-bg);color:var(--active-text)}
.sep{height:1px;background:var(--color-periwinkle);margin:6px 6px;flex:0 0 auto}
.stage{display:flex;flex-direction:column;min-height:0;min-width:0;padding:12px;gap:10px}
.board{flex:1;min-height:0;display:flex;justify-content:center}
#court{width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
.steps{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--btn-border);background:var(--btn-bg);color:var(--btn-text);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem}
.btn.round{width:40px;height:40px;padding:0;font-size:1.2rem;line-height:1}
.btn.primary{background:var(--color-chartreuse);border-color:var(--color-chartreuse);color:var(--color-black)}
.label{font-family:"Funnel Display","Avenir Next",ui-sans-serif,sans-serif;font-weight:500;font-size:1.05rem;min-width:7.5em;text-align:center}
.status{min-height:1.4em;text-align:center;font-size:.9rem;margin:0}
@media (max-width:720px){
  main{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .tools{flex-direction:row;order:2;overflow-x:auto;overflow-y:hidden;padding:6px 8px}
  .tool{flex:0 0 auto;width:60px}
  .sep{width:1px;height:auto;margin:6px 2px}
  .stage{padding:8px;gap:8px}
  h1{font-size:1.1rem}
}
</style>
</head>
<body>
<div class="app">
<section class="view" id="home">
  <header>
    <h1>Coach</h1>
    <button class="hbtn" id="driveBtn" hidden></button>
    <button class="hbtn primary" id="newSys">+ Nouveau système</button>
  </header>
  <div class="home-body">
    <h2>Mes systèmes</h2>
    <ul class="list" id="list"></ul>
    <p class="empty" id="empty">Aucun système pour l’instant. Crée le premier avec « + Nouveau système ».</p>
  </div>
</section>
<section class="view" id="board" data-mode="view">
  <header>
    <button class="hbtn view-only" id="toHome">‹ Systèmes</button>
    <button class="hbtn edit-only" id="done">✓ Terminé</button>
    <h1 class="view-only" id="sysTitle"></h1>
    <input class="name-input edit-only" id="sysName" aria-label="Nom du système" maxlength="80">
    <button class="hbtn primary view-only" id="toEdit">Modifier</button>
    <div class="seg edit-only" role="group" aria-label="Terrain">
      <button data-court="half">Demi-terrain</button>
      <button data-court="full">Terrain entier</button>
    </div>
    <button class="hbtn edit-only" id="undo">Annuler</button>
    <button class="hbtn edit-only" id="delSys">Supprimer</button>
  </header>
  <main>
    <nav class="tools edit-only" aria-label="Outils">
      <button class="tool" data-tool="select"><svg viewBox="0 0 24 24"><path d="M6 3l12 7-5.5 1.6L10 17z" fill="currentColor"/></svg>Déplacer</button>
      <div class="sep"></div>
      <button class="tool" data-tool="O"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><text x="12" y="16" font-size="11" font-weight="700" text-anchor="middle" fill="currentColor" font-family="Mulish,sans-serif">1</text></svg>Attaquant</button>
      <button class="tool" data-tool="X"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>Défenseur</button>
      <button class="tool" data-tool="ball"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 12h17M12 3.5v17M6.3 5.8c3.2 3.4 3.2 9 0 12.4M17.7 5.8c-3.2 3.4-3.2 9 0 12.4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>Ballon</button>
      <div class="sep"></div>
      <button class="tool" data-tool="move"><svg viewBox="0 0 24 24"><path d="M2 12h15" stroke="currentColor" stroke-width="2.2"/><path d="M22 12l-6.5-4v8z" fill="currentColor"/></svg>Course</button>
      <button class="tool" data-tool="pass"><svg viewBox="0 0 24 24"><path d="M2 12h15" stroke="currentColor" stroke-width="2.2" stroke-dasharray="3 2.4"/><path d="M22 12l-6.5-4v8z" fill="currentColor"/></svg>Passe</button>
      <button class="tool" data-tool="dribble"><svg viewBox="0 0 24 24"><path d="M2 12l2-3.5 2.5 7 2.5-7 2.5 7 2.5-3.5h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M22 12l-6.5-4v8z" fill="currentColor"/></svg>Dribble</button>
      <button class="tool" data-tool="screen"><svg viewBox="0 0 24 24"><path d="M2 12h17M19 5.5v13" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>Écran</button>
      <div class="sep"></div>
      <button class="tool" data-tool="eraser"><svg viewBox="0 0 24 24"><path d="M4 15.5l8.5-8.5 6 6-6.5 6.5H8z M9.5 20h11" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Gomme</button>
    </nav>
    <section class="stage">
      <div class="board">
        <svg id="court" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Terrain de basket">
          <g id="courtLayer"></g><g id="dynLayer"></g>
        </svg>
      </div>
      <div class="steps">
        <button class="btn round" id="prev" aria-label="Étape précédente">‹</button>
        <span class="label" id="stepLabel">Étape 1 / 1</span>
        <button class="btn round" id="next" aria-label="Étape suivante">›</button>
        <button class="btn edit-only" id="addStep">+ Ajouter une étape</button>
        <button class="btn edit-only" id="delStep">Supprimer l’étape</button>
        <button class="btn primary" id="play">▶ Lecture</button>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
    </section>
  </main>
</section>
</div>

<script>
(() => {
const NAVY = '#113B54', PINE = '#024442', CHART = '#DBE64C', R = 0.45, KEY = 'tableau-tactique-v1';
const $ = s => document.querySelector(s);
const svg = $('#court'), courtLayer = $('#courtLayer'), dyn = $('#dynLayer');
const HELP = {
  select: 'Glisse un joueur pour le placer. Touche une flèche puis tire ses poignées pour la modifier.',
  O: 'Touche le terrain pour placer un attaquant (5 maximum).',
  X: 'Touche le terrain pour placer un défenseur (5 maximum).',
  ball: 'Touche un attaquant pour lui donner le ballon.',
  move: 'Glisse depuis un joueur jusqu’à sa destination.',
  pass: 'Glisse depuis le porteur du ballon jusqu’à un coéquipier.',
  dribble: 'Glisse depuis le porteur du ballon jusqu’à l’arrivée du dribble.',
  screen: 'Glisse depuis un joueur jusqu’à l’endroit où il pose l’écran.',
  eraser: 'Touche un joueur ou une flèche pour l’effacer.'
};

function fresh(seed, court = 'half') {
  const s = { court, players: [], pos0: {}, ball0: null, frames: [{ actions: [] }], cur: 0, seq: 1 };
  if (seed) {
    [[7.5, 8.4], [12.6, 5.2], [2.4, 5.2], [13.6, 1.3], [9.4, 3.2]].forEach(([x, y], i) => {
      const id = 'i' + s.seq++; s.players.push({ id, team: 'O', num: i + 1 }); s.pos0[id] = { x, y };
    });
    s.ball0 = s.players[0].id;
  }
  return s;
}
/* Bibliothèque : tout l'accès au stockage passe par `store` (à remplacer par Google Drive). */
const LIB_KEY = 'tableau-tactique-lib-v1';
const store = {
  lib: { systems: {}, dirty: {}, trash: [] },
  load() {
    try { const l = JSON.parse(localStorage.getItem(LIB_KEY)); if (l && l.systems) this.lib = l; } catch (e) {}
    this.lib.dirty = this.lib.dirty || {}; this.lib.trash = this.lib.trash || [];
    try { // reprise de l'ancien tableau unique, s'il existe
      const old = JSON.parse(localStorage.getItem(KEY));
      if (old && old.frames) { this.put({ id: newId(), name: 'Mon premier système', data: old }); localStorage.removeItem(KEY); }
    } catch (e) {}
  },
  list() { return Object.values(this.lib.systems).sort((a, b) => b.updatedAt - a.updatedAt); },
  get(id) { return this.lib.systems[id] || null; },
  put(sys) { sys.updatedAt = Date.now(); this.lib.systems[sys.id] = sys; this.lib.dirty[sys.id] = true; this.persist(); drive.push(); },
  remove(id) {
    const sys = this.get(id); if (sys && sys.driveId) this.lib.trash.push(sys.driveId);
    delete this.lib.systems[id]; delete this.lib.dirty[id]; this.persist(); drive.push();
  },
  putRemote(sys) { this.lib.systems[sys.id] = sys; },
  removeLocal(id) { delete this.lib.systems[id]; delete this.lib.dirty[id]; },
  persist() { try { localStorage.setItem(LIB_KEY, JSON.stringify(this.lib)); } catch (e) {} }
};
/* ---------- Google Drive (Google Identity Services + API REST Drive v3) ---------- */
const GOOGLE_CLIENT_ID = '873875861453-0tlekb1bnrrrf1ctbur43bkqddtuo28s.apps.googleusercontent.com';
const DRIVE_FOLDER = 'Coach – systèmes';
const DRIVE_LABEL = {
  unavailable: 'Enregistré sur cet appareil', off: 'Se connecter à Google Drive', connecting: 'Connexion…',
  syncing: 'Synchronisation…', ok: '✓ Drive synchronisé', expired: 'Reconnecter Google Drive', error: 'Erreur Drive · réessayer'
};
const drive = {
  client: null, token: null, exp: 0, folderId: null, status: 'loading', busy: false, again: false, timer: 0,
  init() {
    const sc = document.createElement('script');
    sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true;
    sc.onload = () => {
      try {
        this.client = google.accounts.oauth2.initTokenClient({
          client_id: GOOGLE_CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.file',
          callback: r => this.onToken(r), error_callback: () => this.set('off')
        });
        this.set('off');
      } catch (e) { this.set('unavailable'); }
    };
    sc.onerror = () => this.set('unavailable');
    document.head.appendChild(sc);
  },
  set(st) { this.status = st; updateDriveBtn(); },
  connect() { if (this.client) { this.set('connecting'); this.client.requestAccessToken({ prompt: '' }); } },
  onToken(r) {
    if (r.error || !r.access_token) return this.set('off');
    this.token = r.access_token; this.exp = Date.now() + ((r.expires_in || 3600) - 60) * 1000;
    this.run(() => this.sync());
  },
  push() { clearTimeout(this.timer); this.timer = setTimeout(() => this.run(() => this.flush()), 1200); },
  async run(fn) {
    if (!this.token) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true; this.set('syncing');
    try { await fn(); this.set('ok'); onDriveSynced(); }
    catch (e) { console.error('Drive', e); this.token = e.auth ? null : this.token; this.set(e.auth ? 'expired' : 'error'); }
    finally { this.busy = false; if (this.again && this.token) { this.again = false; this.run(() => this.flush()); } }
  },
  async api(path, opt = {}) {
    if (!this.token || Date.now() > this.exp) { const e = new Error('auth'); e.auth = true; throw e; }
    const r = await fetch('https://www.googleapis.com' + path, { ...opt, headers: { ...(opt.headers || {}), Authorization: 'Bearer ' + this.token } });
    if (r.status === 401) { const e = new Error('auth'); e.auth = true; throw e; }
    if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
    const txt = await r.text(); try { return JSON.parse(txt); } catch (e) { return txt; }
  },
  async folder() {
    if (this.folderId) return this.folderId;
    const q = `name='${DRIVE_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
    const r = await this.api('/drive/v3/files?' + new URLSearchParams({ q, fields: 'files(id)', spaces: 'drive' }));
    if (r.files && r.files.length) return (this.folderId = r.files[0].id);
    const c = await this.api('/drive/v3/files?fields=id', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: DRIVE_FOLDER, mimeType: 'application/vnd.google-apps.folder' }) });
    return (this.folderId = c.id);
  },
  async sync() {
    const folder = await this.folder();
    const q = `'${folder}' in parents and trashed=false`;
    const r = await this.api('/drive/v3/files?' + new URLSearchParams({ q, pageSize: '1000', fields: 'files(id,appProperties)', spaces: 'drive' }));
    const remote = new Map();
    for (const f of r.files || []) { const cid = f.appProperties && f.appProperties.coachId; if (cid && !store.lib.trash.includes(f.id)) remote.set(cid, f); }
    for (const [cid, f] of remote) {          // récupérer ce qui est plus récent sur Drive
      const loc = store.get(cid), rUp = +(f.appProperties.updatedAt || 0);
      if (!loc || (!store.lib.dirty[cid] && rUp > loc.updatedAt)) {
        const c = await this.api(`/drive/v3/files/${f.id}?alt=media`);
        if (c && c.data && c.data.frames) store.putRemote({ id: cid, name: c.name || 'Sans nom', updatedAt: c.updatedAt || rUp, data: c.data, driveId: f.id });
      } else if (!loc.driveId) loc.driveId = f.id;
    }
    for (const sys of store.list()) {         // supprimés ailleurs, ou jamais envoyés
      if (sys.driveId && !remote.has(sys.id) && !store.lib.dirty[sys.id]) store.removeLocal(sys.id);
      else if (!sys.driveId) store.lib.dirty[sys.id] = true;
    }
    store.persist();
    await this.flush();
  },
  async flush() {
    for (const did of [...store.lib.trash]) { // corbeille Drive (récupérable), jamais de suppression définitive
      try { await this.api(`/drive/v3/files/${did}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ trashed: true }) }); }
      catch (e) { if (e.status !== 404) throw e; }
      store.lib.trash = store.lib.trash.filter(x => x !== did); store.persist();
    }
    for (const id of Object.keys(store.lib.dirty)) {
      const sys = store.get(id); if (!sys) { delete store.lib.dirty[id]; continue; }
      const stamp = sys.updatedAt, res = await this.upload(sys), cur = store.get(id);
      if (cur) { cur.driveId = res.id; if (cur.updatedAt === stamp) delete store.lib.dirty[id]; }
      store.persist();
    }
  },
  async upload(sys) {
    const meta = { name: sys.name + '.json', mimeType: 'application/json', appProperties: { coachId: sys.id, updatedAt: String(sys.updatedAt) } };
    if (!sys.driveId) meta.parents = [await this.folder()];
    const b = 'coach' + Math.random().toString(36).slice(2);
    const content = JSON.stringify({ app: 'coach', version: 1, id: sys.id, name: sys.name, updatedAt: sys.updatedAt, data: sys.data });
    const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${b}--`;
    const path = sys.driveId ? `/upload/drive/v3/files/${sys.driveId}?uploadType=multipart&fields=id` : '/upload/drive/v3/files?uploadType=multipart&fields=id';
    try { return await this.api(path, { method: sys.driveId ? 'PATCH' : 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body }); }
    catch (e) { if (e.status === 404 && sys.driveId) { sys.driveId = null; return this.upload(sys); } throw e; }
  }
};
function updateDriveBtn() {
  const b = $('#driveBtn'), st = drive.status;
  b.hidden = st === 'loading'; b.textContent = DRIVE_LABEL[st] || '';
  b.disabled = st === 'unavailable' || st === 'connecting' || st === 'syncing';
}
function onDriveSynced() {
  if ($('#home').classList.contains('active')) return renderHome();
  if (!currentId || mode === 'edit' || anim) return;
  const sys = store.get(currentId);
  if (!sys) { location.hash = '#/'; return; }
  const cur = state.cur; state = JSON.parse(JSON.stringify(sys.data)); state.cur = Math.min(cur, state.frames.length - 1);
  $('#sysTitle').textContent = sys.name; renderAll();
}

function newId() { return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function save() { if (mode !== 'edit') return; const sys = store.get(currentId); if (sys) { sys.data = state; store.put(sys); } }

let currentId = null, mode = 'view';
let state = fresh(true);
let tool = 'select', sel = null, drag = null, draft = null, anim = null, raf = 0, hintTimer = 0;
let undoStack = [];

function commit() { undoStack.push(JSON.stringify(state)); if (undoStack.length > 60) undoStack.shift(); }
function undo() { if (!undoStack.length || anim) return; state = JSON.parse(undoStack.pop()); sel = null; save(); renderAll(); }
const uid = () => 'i' + state.seq++;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const fx = v => v.toFixed(3);
const teamOf = id => (state.players.find(p => p.id === id) || {}).team;
const maxY = () => state.court === 'half' ? 14.6 : 28.4;
const clampP = p => ({ x: Math.max(-0.5, Math.min(15.5, p.x)), y: Math.max(-0.5, Math.min(maxY(), p.y)) });

/* ---------- modèle dérivé : positions de chaque étape ---------- */
const moveOf = (k, id) => state.frames[k].actions.find(a => a.actor === id && a.type !== 'pass');
const passOf = k => state.frames[k].actions.find(a => a.type === 'pass');
function derive() {
  const out = []; let pos = {}, ball = state.ball0;
  for (const id in state.pos0) pos[id] = { ...state.pos0[id] };
  for (let k = 0; k < state.frames.length; k++) {
    const end = {};
    for (const id in pos) { const m = moveOf(k, id); end[id] = m ? { ...m.to } : { ...pos[id] }; }
    out.push({ pos, ball, end });
    const p = passOf(k); if (p && pos[p.target]) ball = p.target;
    pos = end;
  }
  out.final = { pos, ball };
  return out;
}

/* ---------- géométrie des flèches (Bézier quadratique) ---------- */
function geom(a, F) {
  const from = F.pos[a.actor]; if (!from) return null;
  let to = a.to;
  if (a.type === 'pass' && a.target && F.end[a.target]) to = F.end[a.target];
  const mx = (from.x + to.x) / 2, my = (from.y + to.y) / 2, dx = to.x - from.x, dy = to.y - from.y;
  const L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  return { from, to, mx, my, nx, ny, c: { x: mx + nx * 2 * a.bend, y: my + ny * 2 * a.bend }, mid: { x: mx + nx * a.bend, y: my + ny * a.bend } };
}
function qpt(p0, c, p2, t) { const u = 1 - t; return { x: u * u * p0.x + 2 * u * t * c.x + t * t * p2.x, y: u * u * p0.y + 2 * u * t * c.y + t * t * p2.y }; }

function actionSVG(a, F, o = {}) {
  const g = geom(a, F); if (!g) return '';
  const color = teamOf(a.actor) === 'X' ? PINE : NAVY;
  const n = Math.max(40, Math.ceil((dist(g.from, g.to) + Math.abs(a.bend) * 2) / 0.04));
  let pts = [];
  for (let i = 0; i <= n; i++) pts.push(qpt(g.from, g.c, g.to, i / n));
  pts = pts.filter(p => dist(p, g.from) > R + 0.08);
  if (a.type === 'pass') pts = pts.filter(p => dist(p, g.to) > R + 0.12);
  if (pts.length < 4) return '';
  const tip = pts[pts.length - 1], back = pts[Math.max(0, pts.length - 6)];
  let dx = tip.x - back.x, dy = tip.y - back.y; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
  const px = -dy, py = dx, HL = 0.5;
  let body = a.type === 'screen' ? pts : pts.filter(p => dist(p, tip) > HL * 0.8);
  if (body.length < 2) body = pts.slice(0, 2);
  if (a.type === 'dribble') {
    let total = 0; for (let i = 1; i < body.length; i++) total += dist(body[i], body[i - 1]);
    const out = [body[0]]; let s = 0;
    for (let i = 1; i < body.length; i++) {
      const seg = dist(body[i], body[i - 1]) || 1; s += seg;
      const tx = (body[i].x - body[i - 1].x) / seg, ty = (body[i].y - body[i - 1].y) / seg;
      const amp = s < total - 0.3 ? 0.17 * Math.sin(2 * Math.PI * s / 0.5) : 0;
      out.push({ x: body[i].x - ty * amp, y: body[i].y + tx * amp });
    }
    body = out;
  }
  const d = 'M' + body.map(p => fx(p.x) + ' ' + fx(p.y)).join('L');
  let head;
  if (a.type === 'screen') {
    head = `<path d="M${fx(tip.x + px * .45)} ${fx(tip.y + py * .45)}L${fx(tip.x - px * .45)} ${fx(tip.y - py * .45)}" stroke="${color}" stroke-width="0.14" stroke-linecap="round"/>`;
  } else {
    const bx = tip.x - dx * HL, by = tip.y - dy * HL;
    head = `<path d="M${fx(tip.x)} ${fx(tip.y)}L${fx(bx + px * .24)} ${fx(by + py * .24)}L${fx(bx - px * .24)} ${fx(by - py * .24)}Z" fill="${color}"/>`;
  }
  const dash = a.type === 'pass' ? ' stroke-dasharray="0.28 0.2"' : '';
  const isSel = o.interactive && sel && sel.kind === 'action' && sel.id === a.id;
  return `<g ${o.interactive ? `data-k="action" data-id="${a.id}"` : 'pointer-events="none"'} opacity="${o.opacity ?? 1}">
    ${o.interactive ? `<path d="${d}" stroke="transparent" stroke-width="0.8" fill="none" pointer-events="stroke"/>` : ''}
    ${isSel ? `<path d="${d}" stroke="${CHART}" stroke-width="0.34" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
    <path d="${d}" stroke="${color}" stroke-width="${a.type === 'screen' ? 0.1 : 0.08}" fill="none" stroke-linejoin="round"${dash}/>${head}</g>`;
}

/* ---------- terrain FIBA (mètres) ---------- */
function renderCourt() {
  const full = state.court === 'full', H = full ? 28 : 14;
  svg.setAttribute('viewBox', full ? '-0.9 -0.9 16.8 29.8' : '-0.9 -0.9 16.8 16.1');
  const st = 'stroke="#113B54" stroke-width="0.07"', ln = st + ' fill="none"';
  const half = `<rect x="5.05" y="0" width="4.9" height="5.8" fill="#BBD1FF" ${st}/>
    <path d="M5.7 5.8A1.8 1.8 0 0 0 9.3 5.8" ${ln}/>
    <path d="M5.7 5.8A1.8 1.8 0 0 1 9.3 5.8" ${ln} stroke-dasharray="0.3 0.25"/>
    <path d="M0.9 0V2.99A6.75 6.75 0 0 0 14.1 2.99V0" ${ln}/>
    <path d="M6.25 1.2V1.575A1.25 1.25 0 0 0 8.75 1.575V1.2" ${ln}/>
    <path d="M6.6 1.2H8.4" stroke="#113B54" stroke-width="0.11"/>
    <path d="M7.5 1.2V1.35" ${ln}/>
    <circle cx="7.5" cy="1.575" r="0.225" ${ln}/>`;
  let s = `<rect x="0" y="0" width="15" height="${H}" fill="#E2F4DF" ${st}/>${half}`;
  s += full
    ? `<g transform="matrix(1 0 0 -1 0 28)">${half}</g><path d="M0 14H15" ${ln}/><circle cx="7.5" cy="14" r="1.8" ${ln}/>`
    : `<path d="M5.7 14A1.8 1.8 0 0 1 9.3 14" ${ln}/>`;
  courtLayer.innerHTML = s;
}

/* ---------- rendu des éléments ---------- */
function playerSVG(pl, p, selected) {
  const ring = selected ? `<circle cx="${fx(p.x)}" cy="${fx(p.y)}" r="0.66" fill="${CHART}"/>` : '';
  const txt = 'font-family="Mulish, system-ui, sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="central"';
  if (pl.team === 'O') {
    return `<g data-k="player" data-id="${pl.id}">${ring}<circle cx="${fx(p.x)}" cy="${fx(p.y)}" r="${R}" fill="${NAVY}" stroke="#FFFFFF" stroke-width="0.06"/>
      <text x="${fx(p.x)}" y="${fx(p.y)}" font-size="0.5" fill="#FFFFFF" ${txt} pointer-events="none">${pl.num}</text></g>`;
  }
  const a = 0.28;
  return `<g data-k="player" data-id="${pl.id}">${ring}<circle cx="${fx(p.x)}" cy="${fx(p.y)}" r="0.5" fill="transparent" pointer-events="all"/>
    <path d="M${fx(p.x - a)} ${fx(p.y - a)}L${fx(p.x + a)} ${fx(p.y + a)}M${fx(p.x + a)} ${fx(p.y - a)}L${fx(p.x - a)} ${fx(p.y + a)}" stroke="${PINE}" stroke-width="0.14" stroke-linecap="round"/>
    <text x="${fx(p.x + .44)}" y="${fx(p.y + .42)}" font-size="0.34" fill="${PINE}" ${txt} pointer-events="none">${pl.num}</text></g>`;
}
function ballSVG(p) {
  return `<g pointer-events="none"><circle cx="${fx(p.x)}" cy="${fx(p.y)}" r="0.21" fill="${CHART}" stroke="${NAVY}" stroke-width="0.05"/>
    <path d="M${fx(p.x - .21)} ${fx(p.y)}H${fx(p.x + .21)}M${fx(p.x)} ${fx(p.y - .21)}V${fx(p.y + .21)}" stroke="${NAVY}" stroke-width="0.03"/></g>`;
}
function handlesSVG(a, F) {
  const g = geom(a, F); if (!g) return '';
  let s = '';
  if (a.type !== 'pass') s += `<circle data-k="h-to" data-id="${a.id}" cx="${fx(g.to.x)}" cy="${fx(g.to.y)}" r="0.3" fill="#FFFFFF" stroke="${NAVY}" stroke-width="0.07"/>`;
  s += `<circle data-k="h-bend" data-id="${a.id}" cx="${fx(g.mid.x)}" cy="${fx(g.mid.y)}" r="0.3" fill="${CHART}" stroke="${NAVY}" stroke-width="0.07"/>`;
  return s;
}

function renderDyn() {
  const frames = derive(), k = anim ? anim.k : state.cur, F = frames[k], acts = state.frames[k].actions;
  let pos = F.pos, ballP = null, holder = F.ball, html = '';
  if (!anim && k > 0) html += state.frames[k - 1].actions.map(a => actionSVG(a, frames[k - 1], { opacity: 0.18 })).join('');
  if (anim) {
    if (anim.final) { pos = frames.final.pos; holder = frames.final.ball; }
    else {
      pos = {};
      for (const id in F.pos) {
        const m = moveOf(k, id), g = m && geom(m, F);
        pos[id] = g ? qpt(g.from, g.c, g.to, anim.t) : F.pos[id];
      }
      const p = passOf(k), g = p && geom(p, F);
      if (g) ballP = qpt(g.from, g.c, g.to, anim.t);
      html += acts.map(a => actionSVG(a, F, { opacity: 0.28 })).join('');
    }
  } else {
    html += acts.map(a => actionSVG(a, F, { interactive: true })).join('');
  }
  if (draft) html += actionSVG(draft, F, { opacity: 0.85 });
  for (const pl of state.players) if (pos[pl.id]) html += playerSVG(pl, pos[pl.id], !anim && sel && sel.kind === 'player' && sel.id === pl.id);
  if (!ballP && holder && pos[holder]) ballP = { x: pos[holder].x + 0.38, y: pos[holder].y - 0.38 };
  if (ballP) html += ballSVG(ballP);
  if (!anim && sel && sel.kind === 'action') { const a = acts.find(x => x.id === sel.id); if (a) html += handlesSVG(a, F); }
  dyn.innerHTML = html;
}

function updateUI() {
  document.querySelectorAll('[data-tool]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tool === tool));
  document.querySelectorAll('[data-court]').forEach(b => b.setAttribute('aria-pressed', b.dataset.court === state.court));
  const n = state.frames.length, busy = !!anim;
  $('#stepLabel').textContent = `Étape ${(anim ? anim.k : state.cur) + 1} / ${n}`;
  $('#prev').disabled = busy || state.cur === 0;
  $('#next').disabled = busy || state.cur === n - 1;
  $('#addStep').disabled = busy;
  $('#delStep').disabled = busy || n === 1;
  $('#undo').disabled = busy || !undoStack.length;
  $('#play').textContent = anim ? '■ Stop' : '▶ Lecture';
  if (!hintTimer) $('#status').textContent = mode === 'edit' ? HELP[tool] : 'Lecture pour voir le système, ‹ › pour avancer étape par étape.';
}
function renderAll() { renderCourt(); renderDyn(); updateUI(); }
function hint(msg) {
  clearTimeout(hintTimer); $('#status').textContent = msg;
  hintTimer = setTimeout(() => { hintTimer = 0; updateUI(); }, 2800);
}

/* ---------- mutations ---------- */
function addPlayer(team, p) {
  const same = state.players.filter(x => x.team === team);
  if (same.length >= 5) return hint(team === 'O' ? 'Il y a déjà 5 attaquants.' : 'Il y a déjà 5 défenseurs.');
  commit();
  const used = new Set(same.map(x => x.num)); let num = 1; while (used.has(num)) num++;
  const id = uid(); state.players.push({ id, team, num }); state.pos0[id] = clampP(p);
  if (team === 'O' && !state.ball0) state.ball0 = id;
  save();
}
function removePlayer(id) {
  commit();
  state.players = state.players.filter(p => p.id !== id); delete state.pos0[id];
  if (state.ball0 === id) state.ball0 = null;
  state.frames.forEach(f => f.actions = f.actions.filter(a => a.actor !== id && a.target !== id));
  sel = null; save();
}
function removeAction(id) {
  commit(); state.frames.forEach(f => f.actions = f.actions.filter(a => a.id !== id)); sel = null; save();
}
function findAction(id) { return state.frames[state.cur].actions.find(a => a.id === id); }
function finishDraft() {
  const F = derive()[state.cur], from = F.pos[draft.actor];
  if (!from || dist(from, draft.to) < 0.6) return;
  const f = state.frames[state.cur];
  if (draft.type === 'pass') {
    let target = null, bd = 1.3;
    for (const [id, q] of Object.entries(F.end)) {
      if (id === draft.actor || teamOf(id) !== 'O') continue;
      const d = dist(q, draft.to); if (d < bd) { bd = d; target = id; }
    }
    if (!target) return hint('Termine la passe sur un coéquipier.');
    commit();
    f.actions = f.actions.filter(a => a.type !== 'pass');
    const a = { id: uid(), type: 'pass', actor: draft.actor, target, to: { ...F.end[target] }, bend: 0 };
    f.actions.push(a); sel = { kind: 'action', id: a.id };
  } else {
    commit();
    f.actions = f.actions.filter(a => !(a.actor === draft.actor && a.type !== 'pass'));
    const a = { id: uid(), type: draft.type, actor: draft.actor, to: clampP(draft.to), bend: 0 };
    f.actions.push(a); sel = { kind: 'action', id: a.id };
  }
  save();
}

/* ---------- interactions ---------- */
function svgPoint(e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  const q = p.matrixTransform(svg.getScreenCTM().inverse()); return { x: q.x, y: q.y };
}
svg.addEventListener('pointerdown', e => {
  if (anim || mode !== 'edit') return;
  e.preventDefault();
  const p = svgPoint(e), F = derive()[state.cur];
  const el = e.target.closest('[data-k]'), k = el && el.dataset.k, id = el && el.dataset.id;
  svg.setPointerCapture(e.pointerId);
  if (k === 'h-to' || k === 'h-bend') { commit(); drag = { type: k, id }; renderDyn(); return; }
  switch (tool) {
    case 'select':
      if (k === 'player') {
        sel = { kind: 'player', id };
        if (state.cur === 0) { commit(); drag = { type: 'player', id, dx: state.pos0[id].x - p.x, dy: state.pos0[id].y - p.y }; }
        else hint('Les positions se règlent à l’étape 1. Ici, fais bouger le joueur avec une flèche.');
      } else if (k === 'action') sel = { kind: 'action', id };
      else sel = null;
      break;
    case 'O': case 'X': addPlayer(tool, p); break;
    case 'ball':
      if (k !== 'player') break;
      if (teamOf(id) !== 'O') { hint('Le ballon va à un attaquant.'); break; }
      if (state.cur !== 0) { hint('Le ballon se place à l’étape 1, ensuite il suit les passes.'); break; }
      commit(); state.ball0 = id; save(); break;
    case 'eraser':
      if (k === 'player') removePlayer(id); else if (k === 'action') removeAction(id);
      break;
    default: {
      let actor = k === 'player' ? id : null;
      if (!actor) { let bd = 0.8; for (const [pid, q] of Object.entries(F.pos)) { const d = dist(q, p); if (d < bd) { bd = d; actor = pid; } } }
      if (!actor) { hint('Pars d’un joueur pour tracer.'); break; }
      if ((tool === 'pass' || tool === 'dribble') && F.ball !== actor) { hint(tool === 'pass' ? 'Seul le porteur du ballon peut passer.' : 'Seul le porteur du ballon peut dribbler.'); break; }
      draft = { type: tool, actor, to: p, bend: 0 };
    }
  }
  renderDyn(); updateUI();
});
svg.addEventListener('pointermove', e => {
  if (!drag && !draft) return;
  const p = clampP(svgPoint(e));
  if (draft) draft.to = p;
  else if (drag.type === 'player') state.pos0[drag.id] = clampP({ x: p.x + drag.dx, y: p.y + drag.dy });
  else {
    const a = findAction(drag.id); if (!a) return;
    if (drag.type === 'h-to') a.to = p;
    else { const g = geom(a, derive()[state.cur]); if (g) a.bend = (p.x - g.mx) * g.nx + (p.y - g.my) * g.ny; }
  }
  renderDyn();
});
function endPointer() {
  if (drag) { drag = null; save(); }
  if (draft) { finishDraft(); draft = null; }
  renderDyn(); updateUI();
}
svg.addEventListener('pointerup', endPointer);
svg.addEventListener('pointercancel', () => { draft = null; endPointer(); });

document.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => { tool = b.dataset.tool; clearTimeout(hintTimer); hintTimer = 0; updateUI(); }));
document.querySelectorAll('[data-court]').forEach(b => b.addEventListener('click', () => {
  if (anim || state.court === b.dataset.court) return;
  commit(); state.court = b.dataset.court;
  if (state.court === 'half') {
    for (const id in state.pos0) state.pos0[id] = clampP(state.pos0[id]);
    state.frames.forEach(f => f.actions.forEach(a => a.to = clampP(a.to)));
  }
  save(); renderAll();
}));
$('#undo').addEventListener('click', undo);
$('#sysName').addEventListener('input', e => {
  const sys = store.get(currentId); if (!sys) return;
  sys.name = e.target.value.trim() || 'Sans nom'; store.put(sys);
});
let delArmed = 0;
$('#delSys').addEventListener('click', () => {
  if (!delArmed) {
    $('#delSys').textContent = 'Confirmer ?'; $('#delSys').classList.add('primary');
    delArmed = setTimeout(disarmDel, 3000); return;
  }
  disarmDel(); store.remove(currentId); currentId = null; location.hash = '#/';
});
function disarmDel() { clearTimeout(delArmed); delArmed = 0; $('#delSys').textContent = 'Supprimer'; $('#delSys').classList.remove('primary'); }
$('#prev').addEventListener('click', () => { state.cur--; sel = null; save(); renderDyn(); updateUI(); });
$('#next').addEventListener('click', () => { state.cur++; sel = null; save(); renderDyn(); updateUI(); });
$('#addStep').addEventListener('click', () => {
  commit(); state.frames.splice(state.cur + 1, 0, { actions: [] }); state.cur++; sel = null; save(); renderDyn(); updateUI();
});
$('#delStep').addEventListener('click', () => {
  if (state.frames.length < 2) return;
  commit(); state.frames.splice(state.cur, 1); state.cur = Math.min(state.cur, state.frames.length - 1); sel = null; save(); renderDyn(); updateUI();
});

const ease = t => t * t * (3 - 2 * t);
function stopAnim() { cancelAnimationFrame(raf); anim = null; renderDyn(); updateUI(); }
$('#play').addEventListener('click', () => {
  if (anim) return stopAnim();
  sel = null; draft = null;
  const n = state.frames.length, D = 1300; let k = 0, t0 = null;
  anim = { k: 0, t: 0 }; updateUI();
  const step = ts => {
    if (!anim) return;
    if (t0 === null) t0 = ts;
    let t = (ts - t0) / D;
    if (t >= 1) {
      k++; t0 = ts; t = 0;
      if (k >= n) {
        anim = { k: n - 1, t: 1, final: true }; renderDyn();
        setTimeout(() => { if (anim && anim.final) stopAnim(); }, 1000);
        return;
      }
    }
    anim.k = k; anim.t = ease(t); renderDyn(); updateUI();
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
});

document.addEventListener('keydown', e => {
  if (mode !== 'edit' || e.target.tagName === 'INPUT') return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (e.key === 'Escape') { draft = null; sel = null; renderDyn(); return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && sel && !anim) {
    e.preventDefault();
    if (sel.kind === 'player') removePlayer(sel.id); else removeAction(sel.id);
    renderDyn(); updateUI();
  }
});

/* ---------- écrans : accueil, lecture, édition (navigation par #) ---------- */
const COURT_NAME = { half: 'Demi-terrain', full: 'Terrain entier' };
function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function renderHome() {
  const items = store.list();
  $('#empty').hidden = items.length > 0;
  $('#list').innerHTML = items.map(sys => {
    const n = sys.data.frames.length, d = new Date(sys.updatedAt).toLocaleDateString('fr-FR');
    return `<li><button class="card" data-open="${sys.id}"><span class="name">${esc(sys.name)}</span>
      <span class="meta">${COURT_NAME[sys.data.court] || ''} · ${n} étape${n > 1 ? 's' : ''} · modifié le ${d}</span></button></li>`;
  }).join('');
}
$('#list').addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (b) location.hash = '#/s/' + b.dataset.open; });
$('#newSys').addEventListener('click', () => {
  const sys = { id: newId(), name: 'Nouveau système', data: fresh(true) };
  store.put(sys); location.hash = '#/s/' + sys.id + '/edit';
  setTimeout(() => { $('#sysName').focus(); $('#sysName').select(); }, 50);
});
$('#toHome').addEventListener('click', () => { location.hash = '#/'; });
$('#driveBtn').addEventListener('click', () => { if (drive.status === 'ok') drive.run(() => drive.sync()); else drive.connect(); });
$('#toEdit').addEventListener('click', () => { location.hash = '#/s/' + currentId + '/edit'; });
$('#done').addEventListener('click', () => { location.hash = '#/s/' + currentId; });

function showView(id) { document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === id)); }
function route() {
  if (anim) stopAnim();
  draft = null; drag = null; disarmDel();
  const m = location.hash.match(/^#\/s\/([^/]+)(\/edit)?$/), sys = m && store.get(m[1]);
  if (!sys) { currentId = null; showView('home'); renderHome(); document.title = 'Coach'; return; }
  if (currentId !== sys.id) {
    currentId = sys.id; state = JSON.parse(JSON.stringify(sys.data)); undoStack = []; state.cur = 0;
  }
  mode = m[2] ? 'edit' : 'view';
  if (mode === 'view') { sel = null; }
  $('#board').dataset.mode = mode;
  $('#sysTitle').textContent = sys.name; $('#sysName').value = sys.name; document.title = sys.name + ' · Coach';
  showView('board'); renderAll();
}
window.addEventListener('hashchange', route);
store.load();
route();
drive.init();
})();
</script>
</body>
</html>
