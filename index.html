<style>
:root{--navy:#082135;--red:#961321;--gold:#C59215;--cream:#F3F2ED;--white:#FFFFFF}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--navy);color:var(--white);font-family:Mulish,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}

button{font:inherit;font-weight:700;font-size:16px;padding:14px;border:0;border-radius:10px;background:var(--gold);color:#000;cursor:pointer}
button:disabled{opacity:.6;cursor:default}

.auto .box{visibility:hidden}
</style>
