    const raw = b64(BLOB);
    const salt = raw.slice(0, 16), iv = raw.slice(16, 28), data = raw.slice(28);
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
    return new TextDecoder().decode(plain);
  }
  const f = document.getElementById('f'), pw = document.getElementById('pw'), go = document.getElementById('go'), err = document.getElementById('err');
  const KEY = 'coach-pw';
  const remember = v => { try { localStorage.setItem(KEY, v); } catch (e) {} };
  const forget = () => { try { localStorage.removeItem(KEY); } catch (e) {} };
  const recall = () => { try { return localStorage.getItem(KEY); } catch (e) { return null; } };
  const show = html => { document.open(); document.write(html); document.close(); };
  const reset = () => { go.disabled = false; go.textContent = 'Ouvrir'; };
  f.addEventListener('submit', async e => {
    e.preventDefault();
    err.textContent = '';
    go.disabled = true; go.textContent = 'Ouverture…';
    try {
      const html = await unlock(pw.value);
      remember(pw.value);                       // mémorisé sur cet appareil : plus besoin de le retaper
      show(html);
    } catch (x) {
      reset();
      err.textContent = (x && x.name === 'OperationError') ? 'Mot de passe incorrect.' : 'Impossible d\u2019ouvrir l\u2019espace coach.';
      pw.select();
    }
  });
  // Mot de passe déjà retenu sur cet appareil : ouverture automatique
  const saved = recall();
  if (saved) {
    f.hidden = true;
    unlock(saved).then(show).catch(() => { forget(); document.documentElement.classList.remove('auto'); f.hidden = false; reset(); err.textContent = 'Mot de passe à ressaisir.'; });
  }
  if (!window.crypto || !window.crypto.subtle) err.textContent = 'Ce navigateur ne peut pas ouvrir l’espace coach (connexion sécurisée requise).';
})();
</script>
